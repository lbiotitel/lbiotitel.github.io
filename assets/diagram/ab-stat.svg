idth="1" stroke-linejoin="miter" marker-end="url(#d6)"/><text x="8" y="156" text-anchor="start" font-size="10" font-weight="400" fill="#000000">ResourceStat은 MaxHP 변경 이벤트를 받아 현재 HP를 최대값 안으로 맞춤</text><rect x="390" y="8" width="200" height="56" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="490.0" y="26.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">장비 장착</text><text x="490.0" y="40.2" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000">StatModifier(값, 타입, 출처)</text><text x="490.0" y="54.2" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000">→ AddModifier</text><rect x="390" y="86" width="200" height="56" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="490.0" y="104.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">장비 해제</text><text x="490.0" y="118.2" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000">출처가 같은 수정자만 제거</text><text x="490.0" y="132.2" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000">→ RemoveModifier</text><polyline points="388,36 342,36" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d6)"/><polyline points="388,108 388,79 342,79 342,50" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d6)"/></svg>