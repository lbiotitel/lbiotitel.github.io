<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-label="Managers 초기화 순서" preserveAspectRatio="xMidYMid meet" font-family="Helvetica, Arial, Malgun Gothic, sans-serif"><defs><marker id="d16" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 L2.4,4 z" fill="#000000"/></marker></defs><rect x="8" y="10" width="130" height="46" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text x="73.0" y="30.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Managers</text><text x="73.0" y="44.2" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000">Singleton, Start()</text><rect x="158" y="10" width="434" height="46" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="375.0" y="30.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">GetComponentInChildren으로 매니저 9개 참조</text><text x="375.0" y="43.35" text-anchor="middle" font-size="10" font-weight="normal" fill="#000000">Game, Data, Event, UI, PlayerStat, Sound, Stage, Pooling, Battle</text><polyline points="138,33 156,33" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d16)"/><rect x="8" y="82" width="72" height="36" rx="0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/><text x="44.0" y="97.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">1. Data</text><text x="44.0" y="110.35" text-anchor="middle" font-size="10" font-weight="normal" fill="#000000">.Init()</text><rect x="92" y="82" width="72" height="36" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="128.0" y="97.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">2. UI</text><text x="128.0" y="110.35" text-anchor="middle" font-size="10" font-weight="normal" fill="#000000">.Init()</text><polyline points="80,100 90,100" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d16)"/><rect x="176" y="82" width="72" height="36" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="212.0" y="97.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">3. PlayerStat</text><text x="212.0" y="110.35" text-anchor="middle" font-size="10" font-weight="normal" fill="#000000">.Init()</text><polyline points="164,100 174,100" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d16)"/><rect x="260" y="82" width="72" height="36" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="296.0" y="97.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">4. Sound</text><text x="296.0" y="110.35" text-anchor="middle" font-size="10" font-weight="normal" fill="#000000">.Init()</text><polyline points="248,100 258,100" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d16)"/><rect x="344" y="82" width="72" height="36" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="380.0" y="97.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">5. Stage</text><text x="380.0" y="110.35" text-anchor="middle" font-size="10" font-weight="normal" fill="#000000">.Init()</text><polyline points="332,100 342,100" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d16)"/><rect x="428" y="82" width="72" height="36" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="464.0" y="97.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">6. Pooling</text><text x="464.0" y="110.35" text-anchor="middle" font-size="10" font-weight="normal" fill="#000000">.Init()</text><polyline points="416,100 426,100" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d16)"/><rect x="512" y="82" width="72" height="36" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="548.0" y="97.35" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">7. Battle</text><text x="548.0" y="110.35" text-anchor="middle" font-size="10" font-weight="normal" fill="#000000">.Init()</text><polyline points="500,100 510,100" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d16)"/><text x="8" y="138" text-anchor="start" font-size="10" font-weight="400" fill="#000000">데이터를 가장 먼저 로드해서, 이후 매니저가 데이터를 바로 쓸 수 있도록 순서를 직접 지정</text><polyline points="73,56 58,56 58,80 44,80" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="miter" marker-end="url(#d16)"/></svg>